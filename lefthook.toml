#:schema https://raw.githubusercontent.com/evilmartians/lefthook/refs/heads/master/schema.json

[pre-commit]
parallel = true

[pre-commit.commands]
format = { glob = "*.rs", run = "rustfmt {staged_files}", stage_fixed = true }

[pre-push]
parallel = true

[pre-push.commands]
format = { run = "cargo fmt --all --check" }
clippy = { run = "cargo clippy --workspace --locked -- -D warnings" }
